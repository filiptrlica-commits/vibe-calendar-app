<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Vibe Calendar</title>
<meta name="description" content="Vizuální plánovač úkolů, poznámek a priorit" />

<!-- PWA manifest is generated at runtime as a Data URL by setupManifest() in app.js.
     It references icon-192.png / icon-512.png / maskable-icon-512.png which must be
     uploaded in the SAME folder as this index.html. -->
<link id="manifestLink" rel="manifest" href="" />
<link id="faviconLink" rel="icon" type="image/png" href="icon-192.png" />
<meta name="theme-color" content="#34D399" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vibe Calendar" />
<link id="appleTouchIcon" rel="apple-touch-icon" href="apple-touch-icon.png" />

<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="toastRoot"></div>
    <div id="reminderBannerRoot"></div>
    <div id="sharedOverlayRoot"></div>
    <div id="timersWidget"></div>
    <div id="alarmOverlayRoot"></div>
    <div id="assistantWidget"></div>
    <div class="wrap-max">
      <div id="topBar"></div>
      <div id="calendarView">
        <div id="quoteWidget"></div>
        <div id="addForm"></div>
        <div id="listFilter"></div>
        <div id="calendarStrip"></div>
        <div id="lanesContainer"></div>
        <div id="notesContainer"></div>
      </div>
      <div id="recipesView" class="hidden"></div>
      <div id="mealsView" class="hidden"></div>
      <div id="notesView" class="hidden"></div>
      <div id="documentsView" class="hidden"></div>
      <div id="medicationsView" class="hidden"></div>
      <div id="workoutsView" class="hidden"></div>
      <div id="settingsView" class="hidden"></div>
    </div>
    <div id="modalsRoot"></div>
    <div id="activityStopwatchRoot"></div>
  </div>

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
